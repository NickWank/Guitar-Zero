<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guitar Hero Clone</title>
  </head>
  <body>
    <canvas id="highway"></canvas>
    <div id="hud" hidden>
      <span id="score">0</span>
      <span id="combo"></span>
      <span id="sync-offset" title="Adjust with [ and ]">offset 0.00s</span>
    </div>
    <div id="countdown" hidden></div>
    <div id="menu">
      <p id="menu-status">Loading song…</p>
      <div id="difficulty-picker"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
